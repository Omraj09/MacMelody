name: 💡 Feature Request
description: Suggest an idea or enhancement for MacMelody.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: "A clear description of what the problem is (e.g. I'm always frustrated when...)"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      placeholder: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: "Add any other context, screenshots, or examples here."
